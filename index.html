<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myntra Growth PM Discovery Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 18px 24px; background: #1e293b; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; }
    header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; }
    .user { align-self: flex-end; background: #ff3f6c; color: #ffffff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-bottom-left-radius: 2px; }
    .bot table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
    .bot th, .bot td { border: 1px solid #475569; padding: 8px 12px; text-align: left; }
    .bot th { background-color: #334155; color: #f8fafc; }
    .bot ul, .bot ol { margin-left: 20px; margin-top: 6px; margin-bottom: 6px; }
    .bot p { margin-bottom: 8px; }
    .bot p:last-child { margin-bottom: 0; }
    #input-form { display: flex; padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; gap: 12px; }
    #query-input { flex: 1; padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
    #query-input:focus { border-color: #ff3f6c; }
    #send-btn { background: #ff3f6c; color: #fff; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Myntra Growth PM Discovery Engine</h1>
    <p>Wishlist drop-off discovery across fit, fabric, styling & choice paralysis.</p>
  </header>

  <div id="chat-container">
    <div class="message bot">
      Hi! I am the Myntra Growth PM Discovery Engine. Ask any question about wishlist drop-offs, user frictions, or opportunity evaluation across our 4 behavioral dimensions.
    </div>
  </div>

  <form id="input-form">
    <input type="text" id="query-input" placeholder="Type your question..." autocomplete="off" required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const webhookUrl = 'https://myntradiscovery.app.n8n.cloud/webhook/89deff80-8185-4db8-9778-c2d8799486ef/chat';
    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-form');
    const queryInput = document.getElementById('query-input');
    const sendBtn = document.getElementById('send-btn');
    const sessionId = 'session_' + Math.random().toString(36).substring(2, 10);

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = sender === 'bot' ? marked.parse(text) : text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = queryInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      queryInput.value = '';
      sendBtn.disabled = true;

      const loadingMsg = appendMessage('bot', 'Analyzing and quantifying drop-off opportunities...');

      try {
        const res = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'sendMessage',
            sessionId: sessionId,
            chatInput: message
          })
        });

        const rawText = await res.text();
        let fullOutput = '';
        const lines = rawText.split('\n');

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const cleanLine = trimmed.startsWith('data:') ? trimmed.replace(/^data:\s*/, '') : trimmed;
            const parsed = JSON.parse(cleanLine);
            if (parsed.content !== undefined) fullOutput += parsed.content;
            else if (parsed.output !== undefined) fullOutput += parsed.output;
            else if (parsed.text !== undefined) fullOutput += parsed.text;
          } catch {
            if (!fullOutput) fullOutput += line;
          }
        }

        loadingMsg.innerHTML = marked.parse(fullOutput || rawText);
      } catch (err) {
        loadingMsg.innerHTML = '<strong>Error:</strong> Failed to fetch analysis from n8n backend.';
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
